name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the EC2 k3s server after building"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/ushankamesh-devx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check database setup scripts
        run: python3 -m unittest discover -s api/scripts -p 'test_*.py' -v

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/ddas-api:${{ github.sha }}
            ${{ env.REGISTRY }}/ddas-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile.migrations
          push: true
          tags: |
            ${{ env.REGISTRY }}/ddas-migrations:${{ github.sha }}
            ${{ env.REGISTRY }}/ddas-migrations:latest
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Verify migration image with disposable MySQL
        run: |
          docker pull "$REGISTRY/ddas-migrations:${{ github.sha }}"
          python3 api/scripts/verify_container_setup.py --image "$REGISTRY/ddas-migrations:${{ github.sha }}"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: VITE_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY }}/ddas-web:${{ github.sha }}
            ${{ env.REGISTRY }}/ddas-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    concurrency:
      group: ddas-production-deploy
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install release deployment scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/*"
          target: "k8s"
          strip_components: 1
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 35m
          script: bash ~/k8s/deploy.sh ${{ github.sha }}
