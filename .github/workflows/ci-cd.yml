name: Build images

on:
  push:
    branches: [production]   # main is for development; merge main → production to release
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the EC2 k3s server after building"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/ushankamesh-devx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/ddas-api:${{ github.sha }}
            ${{ env.REGISTRY }}/ddas-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: VITE_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY }}/ddas-web:${{ github.sha }}
            ${{ env.REGISTRY }}/ddas-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: ~/k8s/deploy.sh ${{ github.sha }}
