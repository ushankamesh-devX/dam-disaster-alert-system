[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --html=reports/report.html --self-contained-html
markers =
    smoke: quick smoke tests verifying app launches and core elements render
    nav: navigation between tabs and screens
    dashboard: dashboard screen tests
    news: news feed and detail modal tests
    emergency: emergency contact and shelters tests
    alerts: disaster alerts feed and counters tests
    report: citizen report issues tests
    hazard: full hazard map and fake call simulator tests
    settings: language and settings tests
    resilience: error handling, offline fallbacks, and edge cases
