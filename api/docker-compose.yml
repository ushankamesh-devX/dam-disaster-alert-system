services:
  mysql:
    image: mysql:8.0
    container_name: ddas-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dam_disaster_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ddas-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ddas-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - ddas-network

  api:
    build: .
    container_name: ddas-api
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dam_disaster_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - ddas-network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: ddas-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - ddas-network

volumes:
  mysql-data:

networks:
  ddas-network:
    driver: bridge
