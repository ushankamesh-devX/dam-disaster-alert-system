services:
  mysql:
    image: mysql:8.0
    container_name: ddas-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dam_disaster_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ddas-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ddas-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - ddas-network

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ddas-mqtt-broker
    restart: always
    ports:
      - "1883:1883"   # MQTT TCP  — ESP32 devices connect here
      - "9001:9001"   # MQTT WebSocket — Web dashboard subscribes here
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "ddas/system/healthcheck", "-m", "ping", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ddas-network

  api:
    build: .
    container_name: ddas-api
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dam_disaster_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      DDAS_ADMIN_EMAIL: ${DDAS_ADMIN_EMAIL:-}
      DDAS_ADMIN_PASSWORD: ${DDAS_ADMIN_PASSWORD:-}
      DDAS_ADMIN_NAME: ${DDAS_ADMIN_NAME:-DDAS Administrator}
      # MQTT Broker connection (Eclipse Mosquitto)
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_CLIENT_ID: ddas-api-server
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - ddas-network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: ddas-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - ddas-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ddas-qdrant
    restart: always
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ddas-network

  minio:
    image: minio/minio:latest
    container_name: ddas-minio
    restart: always
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # MinIO Web Console UI
    volumes:
      - minio-data:/data
    networks:
      - ddas-network

  mlflow:
    build:
      context: ../ai
      dockerfile: Dockerfile.mlflow
    container_name: ddas-mlflow
    restart: always
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
    command: >
      --backend-store-uri mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/mlflow_db
      --default-artifact-root s3://ddas-artifacts/mlflow
      --artifacts-destination s3://ddas-artifacts/mlflow
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "*"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ddas-network

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: ddas-ai
    restart: always
    environment:
      DDAS_AI_SPRING_DATA_BASE_URL: http://api:8080/api/v1/internal/ml
      DDAS_AI_SPRING_TIMEOUT_SECONDS: "10"
      DDAS_AI_INCOMING_SERVICE_TOKEN: ${DDAS_AI_INCOMING_SERVICE_TOKEN:-}
      DDAS_AI_SPRING_SERVICE_TOKEN: ${DDAS_AI_SPRING_SERVICE_TOKEN:-}
      DDAS_AI_ENABLE_DOCS: "true"
      DDAS_AI_QDRANT_URL: http://qdrant:6333
      DDAS_AI_MINIO_ENDPOINT: minio:9000
      DDAS_AI_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DDAS_AI_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DDAS_AI_MINIO_SECURE: "false"
      DDAS_AI_MINIO_BUCKET: ddas-artifacts
      DDAS_AI_MLFLOW_TRACKING_URI: http://mlflow:5000
      DDAS_AI_ENABLE_MLFLOW_AUTO_TRACKING: "true"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "8000:8000"
    depends_on:
      - api
      - qdrant
      - minio
      - mlflow
    networks:
      - ddas-network

volumes:
  mysql-data:
  mosquitto-data:
  mosquitto-log:
  qdrant-data:
  minio-data:

networks:
  ddas-network:
    driver: bridge
