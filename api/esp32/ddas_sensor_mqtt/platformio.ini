; =====================================================
;  DDAS - Dam Disaster Alert System
;  PlatformIO Project Configuration
;  MQTT Firmware for ESP32
;
;  VS Code + PlatformIO IDE Setup:
;   1. VS Code install කරන්න: https://code.visualstudio.com/
;   2. Extensions > "PlatformIO IDE" search කර install කරන්න
;   3. PlatformIO Home > New Project:
;        Name      : Dam_Sensor_MQTT
;        Board     : Espressif ESP32 Dev Module
;        Framework : Arduino
;   4. platformio.ini replace කරන්න මෙම file එකෙන්
;   5. pio run --target upload  (firmware upload)
;   6. pio device monitor       (serial monitor)
; =====================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed   = 115200
monitor_filters =
    default
    esp32_exception_decoder

; Upload speed
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_ESP32_DEV
    -DMQTT_MAX_PACKET_SIZE=512

; -------------------------------------------------------
; Dependencies
;   PubSubClient  - MQTT client (Nick O'Leary)
;   ArduinoJson   - JSON parse/serialize (v6 API)
; -------------------------------------------------------
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
