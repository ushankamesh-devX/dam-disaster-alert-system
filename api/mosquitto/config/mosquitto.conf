# =====================================================
#  DDAS - Dam Disaster Alert System
#  Eclipse Mosquitto MQTT Broker Configuration
# =====================================================

# ----------------------------
# MQTT Listener (TCP) - Port 1883
# ESP32 devices connect here
# ----------------------------
listener 1883
protocol mqtt

# ----------------------------
# WebSocket Listener - Port 9001
# Web dashboard can subscribe here
# ----------------------------
listener 9001
protocol websockets

# ----------------------------
# Authentication
# Development: anonymous allowed
# Production:  set allow_anonymous false and use password_file
# ----------------------------
allow_anonymous true

# For production, uncomment and create password file:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ----------------------------
# Persistence (store messages across restarts)
# ----------------------------
persistence true
persistence_location /mosquitto/data/

# ----------------------------
# Logging
# ----------------------------
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ----------------------------
# Connection tuning
# ----------------------------
max_connections 100

# ----------------------------
# DDAS MQTT Topic Structure:
#
#   ddas/sensors/{sensorUid}/readings   - ESP32 publishes sensor data
#   ddas/sensors/{sensorUid}/status     - ESP32 publishes device health
#   ddas/sensors/{sensorUid}/config     - Server pushes config to device
#   ddas/alerts/{damId}                 - Server publishes alert events
#   ddas/system/heartbeat               - Broker heartbeat
# ----------------------------
