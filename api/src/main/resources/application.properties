spring.application.name=Dam Disaster Alert System API
server.port=8080

# ============================================================================
# Database Configuration
# ============================================================================
# MySQL running in Docker container (ddas-mysql) on DigitalOcean droplet
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://157.245.159.17:3306/dam_disaster_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ddas_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@DDAS/2022/XXXX_DB_USER!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (to handle remote connection better)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# ============================================================================
# JPA / Hibernate Configuration
# ============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================================================
# JWT Configuration
# ============================================================================
jwt.secret=${JWT_SECRET:ddasSecretKeyForJWTTokenGenerationPleaseChangeInProduction12345678901234567890}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================================
# Actuator Configuration (Health Check)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.ddas.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# Error Handling
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
