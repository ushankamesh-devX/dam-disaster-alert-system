spring.application.name=Dam Disaster Alert System API
spring.config.import=optional:file:.env[.properties]
server.port=8080

# ============================================================================
# Database Configuration
# ============================================================================
# Host-run Spring Boot uses Docker's published MySQL port. Containers override these.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dam_disaster_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:ddas_dev}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (to handle remote connection better)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Read replica (MySQL Router read-only port in k8s). Empty = all queries use the writer.
ddas.datasource.reader-url=${DDAS_DATASOURCE_READER_URL:}

# ============================================================================
# JPA / Hibernate Configuration
# ============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================================================
# JWT Configuration
# ============================================================================
jwt.secret=${JWT_SECRET:ddasSecretKeyForJWTTokenGenerationPleaseChangeInProduction12345678901234567890}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================================
# Actuator Configuration (Health Check)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.ddas.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# Error Handling
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================================================
# MQTT Configuration (Eclipse Mosquitto via Docker)
# ============================================================================
# Broker URL: tcp://{host}:{port}
# Docker: host = "mosquitto" (service name in docker-compose.yml)
# Local dev: host = "localhost"
mqtt.broker.host=${MQTT_BROKER_HOST:localhost}
mqtt.broker.port=${MQTT_BROKER_PORT:1883}
mqtt.broker.url=tcp://${mqtt.broker.host}:${mqtt.broker.port}
mqtt.client.id=${MQTT_CLIENT_ID:SpringBootBackendClient}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

# MQTT Topics to subscribe (wildcard + supports multiple sensors)
# ddas/sensors/+/readings → all sensors' readings
# ddas/sensors/+/status   → all sensors' status/LWT
mqtt.topic.readings=ddas/sensors/+/readings
mqtt.topic.status=ddas/sensors/+/status

# MQTT QoS level (0=at most once, 1=at least once, 2=exactly once)
mqtt.qos=1

# Logging
logging.level.com.ddas.api.service.MqttSubscriberService=DEBUG
logging.level.com.ddas.api.service.HazardAssessmentService=DEBUG
logging.level.com.ddas.api.service.SmsDispatcherService=DEBUG

# ============================================================================
# SMS Configuration — Step 6
# ============================================================================
# SMS provider: notifylk | mock
# mock = Development mode (logs to console, no real SMS sent)
# notifylk = Production mode (requires Notify.lk credentials below)
sms.provider=${SMS_PROVIDER:mock}
sms.enabled=${SMS_ENABLED:false}
sms.max-retries=3

# Notify.lk credentials (required when sms.provider=notifylk). Never commit real values.
notify.user-id=${NOTIFY_USER_ID:}
notify.api-key=${NOTIFY_API_KEY:}
notify.sender-id=${NOTIFY_SENDER_ID:NotifyDEMO}

# Evacuation phone warnings (Expo push + SMS from EvacuationMonitor); off for now
ddas.evacuation.warnings.enabled=${DDAS_EVACUATION_WARNINGS_ENABLED:false}

# ============================================================================
# Hazard Assessment Configuration — Step 5
# ============================================================================
# How long (minutes) to suppress duplicate alerts for the same dam
hazard.duplicate-alert-window-minutes=60

# Brevo API Settings
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url.email=https://api.brevo.com/v3/smtp/email

# ============================================================================
# ML Internal Service Authentication — Phase 1
# ============================================================================
# Service bearer token for FastAPI -> Spring internal stored-data read APIs.
# Minimum 32 characters; must match DDAS_AI_SPRING_SERVICE_TOKEN in ai/.env.
ddas.ai.spring-service-token=${DDAS_AI_SPRING_SERVICE_TOKEN:}

# Bearer token for Spring -> FastAPI requests (triggering predictions/jobs/RAG).
# Minimum 32 characters; must match DDAS_AI_INCOMING_SERVICE_TOKEN in ai/.env.
ddas.ai.incoming-service-token=${DDAS_AI_INCOMING_SERVICE_TOKEN:}

# Valhalla routing engine for evacuation routes
ddas.routing.valhalla.url=${DDAS_ROUTING_VALHALLA_URL:http://localhost:8002}
# Offline route packs rebuild (every 6 h)
ddas.routing.packs.cron=0 15 */6 * * *
# Expo push: only needed if the Expo project enables "enhanced push security"
ddas.push.expo-access-token=${EXPO_ACCESS_TOKEN:}

# AI FastAPI base URL
ddas.ai.backend.url=${DDAS_AI_BACKEND_URL:http://localhost:8000}

# ============================================================================
# ML Forecasting Scheduler Configuration
# ============================================================================
ddas.ml.forecast.enabled=true
ddas.ml.forecast.cron=0 0 * * * *

# ============================================================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:ddas-artifacts}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}


# Multipart upload limit for news images
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
