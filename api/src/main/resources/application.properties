spring.application.name=Dam Disaster Alert System API
server.port=8080

# ============================================================================
# Database Configuration
# ============================================================================
# MySQL running in Docker container (ddas-mysql) on DigitalOcean droplet
# ?????? SPRING_DATASOURCE_URL ????? ?????? ??? (IntelliJ ????), ???????????? localhost ???????.
spring.datasource.url=jdbc:mysql://localhost:3306/dam_disaster_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ddas_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@DDAS/2022/XXXX_DB_USER!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (to handle remote connection better)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# ============================================================================
# JPA / Hibernate Configuration
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================================================
# JWT Configuration
# ============================================================================
jwt.secret=${JWT_SECRET:ddasSecretKeyForJWTTokenGenerationPleaseChangeInProduction12345678901234567890}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================================
# Actuator Configuration (Health Check)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.ddas.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# Error Handling
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================================================
# MQTT Configuration (Eclipse Mosquitto via Docker)
# ============================================================================
# Broker URL: tcp://{host}:{port}
# Docker: host = "mosquitto" (service name in docker-compose.yml)
# Local dev: host = "localhost"
mqtt.broker.host=${MQTT_BROKER_HOST:localhost}
mqtt.broker.port=${MQTT_BROKER_PORT:1883}
mqtt.broker.url=tcp://${mqtt.broker.host}:${mqtt.broker.port}
mqtt.client.id=${MQTT_CLIENT_ID:SpringBootBackendClient}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

# MQTT Topics to subscribe (wildcard + supports multiple sensors)
# ddas/sensors/+/readings → all sensors' readings
# ddas/sensors/+/status   → all sensors' status/LWT
mqtt.topic.readings=ddas/sensors/+/readings
mqtt.topic.status=ddas/sensors/+/status

# MQTT QoS level (0=at most once, 1=at least once, 2=exactly once)
mqtt.qos=1

# Logging
logging.level.com.ddas.api.service.MqttSubscriberService=DEBUG
logging.level.com.ddas.api.service.HazardAssessmentService=DEBUG
logging.level.com.ddas.api.service.SmsDispatcherService=DEBUG

# ============================================================================
# SMS Configuration — Step 6
# ============================================================================
# SMS provider: twilio | dialog | mock
# mock = Development mode (logs to console, no real SMS sent)
# twilio = Production mode (requires Twilio account credentials below)
sms.provider=${SMS_PROVIDER:mock}
sms.enabled=${SMS_ENABLED:false}
sms.max-retries=3

# Twilio Credentials (required when sms.provider=twilio)
# Sign up at: https://www.twilio.com/try-twilio
# Free trial account supports real SMS to verified numbers
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:+1234567890}

# ============================================================================
# Hazard Assessment Configuration — Step 5
# ============================================================================
# How long (minutes) to suppress duplicate alerts for the same dam
hazard.duplicate-alert-window-minutes=60

