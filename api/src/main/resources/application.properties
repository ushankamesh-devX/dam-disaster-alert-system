spring.application.name=Dam Disaster Alert System API
server.port=8080

# ============================================================================
# Database Configuration
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/dam_disaster_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ddas_dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@DDAS/2022/XXXX_DB_USER!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# Read replica (MySQL Router read-only port in k8s)
ddas.datasource.reader-url=${DDAS_DATASOURCE_READER_URL:}

# ============================================================================
# JPA / Hibernate Configuration
# ============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================================================
# JWT Configuration
# ============================================================================
jwt.secret=${JWT_SECRET:ddasSecretKeyForJWTTokenGenerationPleaseChangeInProduction12345678901234567890}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================================
# Actuator Configuration (Health Check)
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.ddas.api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================================
# Error Handling
# ============================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================================================
# MQTT Configuration (Eclipse Mosquitto via Docker)
# ============================================================================
mqtt.broker.host=${MQTT_BROKER_HOST:localhost}
mqtt.broker.port=${MQTT_BROKER_PORT:1883}
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=${MQTT_CLIENT_ID:SpringBootBackendClient}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

mqtt.topic.readings=ddas/sensors/+/readings
mqtt.topic.status=ddas/sensors/+/status
mqtt.qos=1

logging.level.com.ddas.api.service.MqttSubscriberService=DEBUG
logging.level.com.ddas.api.service.HazardAssessmentService=DEBUG
logging.level.com.ddas.api.service.SmsDispatcherService=DEBUG

# ============================================================================
# SMS Configuration
# ============================================================================
sms.provider=${SMS_PROVIDER:mock}
sms.enabled=true
notify.user-id=33501
notify.api-key=vWwn3IpWXkCshFjEdo5V
notify.sender-id=NotifyDEMO
sms.max-retries=3

# Twilio Credentials
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:+1234567890}

# ============================================================================
# Hazard Assessment Configuration
# ============================================================================
hazard.duplicate-alert-window-minutes=60

# Brevo API Settings
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url.email=https://api.brevo.com/v3/smtp/email

# ============================================================================
# ML Internal Service Authentication
# ============================================================================
ddas.ai.spring-service-token=${DDAS_AI_SPRING_SERVICE_TOKEN:}
ddas.ai.incoming-service-token=${DDAS_AI_INCOMING_SERVICE_TOKEN:}

ddas.ai.backend.url=${DDAS_AI_BACKEND_URL:http://localhost:8000}

# ============================================================================
# ML Forecasting Scheduler Configuration
# ============================================================================
ddas.ml.forecast.enabled=true
ddas.ml.forecast.cron=0 0 * * * *

DDAS_ADMIN_EMAIL=admin@ddas.gov.lk
DDAS_ADMIN_PASSWORD=Admin@123
DDAS_ADMIN_NAME=Admin
# ============================================================================
# MinIO / S3 Storage Configuration
# ============================================================================
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
minio.bucket-name=${MINIO_BUCKET_NAME:ddas-artifacts}
