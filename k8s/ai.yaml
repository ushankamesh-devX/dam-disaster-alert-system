# FastAPI AI service (forecasts, RAG chat). Only the API calls it: ai:8000.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-artifacts
  namespace: ddas
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: ddas
spec:
  replicas: 1
  strategy:
    type: Recreate   # the artifacts volume is ReadWriteOnce
  selector:
    matchLabels:
      app: ai
  template:
    metadata:
      labels:
        app: ai
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 10001   # image runs as uid 10001
      containers:
        - name: ai
          image: ghcr.io/ushankamesh-devx/ddas-ai:latest
          imagePullPolicy: Always
          env:
            - { name: DDAS_AI_SPRING_DATA_BASE_URL, value: "http://api:8080/api/v1/internal/ml" }
            - { name: DDAS_AI_SPRING_TIMEOUT_SECONDS, value: "10" }
            - name: DDAS_AI_INCOMING_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DDAS_AI_INCOMING_SERVICE_TOKEN } }
            - name: DDAS_AI_SPRING_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DDAS_AI_SPRING_SERVICE_TOKEN } }
            - name: DDAS_AI_GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: GEMINI_API_KEY, optional: true } }
            - { name: DDAS_AI_ENABLE_DOCS, value: "false" }
            - { name: DDAS_AI_ML_ARTIFACTS_DIR, value: /service/artifacts/ml }
            - { name: DDAS_AI_EMBEDDING_MODEL, value: gemini-embedding-2 }
            - { name: DDAS_AI_EMBEDDING_DIMENSION, value: "768" }
            - { name: DDAS_AI_CHAT_MODEL, value: gemini-3.5-flash-lite }
            - { name: DDAS_AI_QDRANT_URL, value: "http://qdrant:6333" }
            - { name: DDAS_AI_MINIO_ENDPOINT, value: "minio:9000" }
            - name: DDAS_AI_MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: MINIO_ROOT_USER } }
            - name: DDAS_AI_MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: MINIO_ROOT_PASSWORD } }
            - { name: DDAS_AI_MINIO_SECURE, value: "false" }
            - { name: DDAS_AI_MINIO_BUCKET, value: ddas-artifacts }
            - { name: DDAS_AI_MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
            - { name: DDAS_AI_ENABLE_MLFLOW_AUTO_TRACKING, value: "true" }
            - { name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio:9000" }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: MINIO_ROOT_USER } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: MINIO_ROOT_PASSWORD } }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - { name: MLFLOW_S3_IGNORE_TLS, value: "true" }
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - { name: artifacts, mountPath: /service/artifacts }
      volumes:
        - name: artifacts
          persistentVolumeClaim: { claimName: ai-artifacts }
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: ddas
spec:
  selector:
    app: ai
  ports:
    - port: 8000
