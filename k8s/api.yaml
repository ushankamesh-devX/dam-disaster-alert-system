# Spring Boot API. Writes go to router :6446 (primary), readOnly transactions to :6447 (replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ddas
spec:
  replicas: 1
  strategy:
    type: Recreate   # not enough RAM on a t3.small to run two API pods during an update
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull   # only needed if the GHCR package is private
      containers:
        - name: api
          image: ghcr.io/ushankamesh-devx/ddas-api:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://ddas-db-router:6446/dam_disaster_db?useSSL=false&allowPublicKeyRetrieval=true
            - name: DDAS_DATASOURCE_READER_URL
              value: jdbc:mysql://ddas-db-router:6447/dam_disaster_db?useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DB_APP_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DB_APP_PASSWORD } }
            - { name: SPRING_JPA_HIBERNATE_DDL_AUTO, value: validate }
            - { name: SPRING_JPA_SHOW_SQL, value: "false" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: JWT_SECRET } }
            - name: DDAS_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DDAS_ADMIN_EMAIL, optional: true } }
            - name: DDAS_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DDAS_ADMIN_PASSWORD, optional: true } }
            - name: DDAS_ADMIN_NAME
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DDAS_ADMIN_NAME, optional: true } }
            - { name: MQTT_BROKER_HOST, value: mosquitto }
            - { name: MQTT_BROKER_PORT, value: "1883" }
            - { name: MQTT_CLIENT_ID, value: ddas-api-server }
            - name: MQTT_USERNAME
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: MQTT_USERNAME } }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: MQTT_PASSWORD } }
            - name: BREVO_API_KEY
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: BREVO_API_KEY, optional: true } }
            - name: SMS_PROVIDER
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: SMS_PROVIDER, optional: true } }
            - name: SMS_ENABLED
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: SMS_ENABLED, optional: true } }
            - name: TWILIO_ACCOUNT_SID
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: TWILIO_ACCOUNT_SID, optional: true } }
            - name: TWILIO_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: TWILIO_AUTH_TOKEN, optional: true } }
            - name: TWILIO_FROM_NUMBER
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: TWILIO_FROM_NUMBER, optional: true } }
            # Small heap and fast start-up for a 2 GB node
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
            # application.properties logs SQL at DEBUG/TRACE; too heavy for this node
            - { name: LOGGING_LEVEL_ORG_HIBERNATE_SQL, value: WARN }
            - { name: LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER, value: WARN }
            - { name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY, value: INFO }
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 36   # up to 6 min to boot on 2 vCPU
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { memory: 384Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api   # must stay "api": web/nginx.conf proxies to http://api:8080
  namespace: ddas
spec:
  selector:
    app: api
  ports:
    - port: 8080
