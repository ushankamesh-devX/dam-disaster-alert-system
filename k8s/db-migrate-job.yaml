# Rendered by migrate.sh with the same immutable image tag as the API release.
apiVersion: batch/v1
kind: Job
metadata:
  name: MIGRATION_JOB
  namespace: ddas
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: MIGRATION_IMAGE
          env:
            - { name: DDAS_MYSQL_HOST, value: ddas-db-router }
            - { name: DDAS_MYSQL_PORT, value: "6446" }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DB_APP_USER } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: ddas-secrets, key: DB_APP_PASSWORD } }
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: backups, mountPath: /backups }
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: db-migration-backups }
