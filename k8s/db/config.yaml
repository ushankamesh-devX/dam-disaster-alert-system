# MySQL settings for a single server on an 8 GB m7i-flex.large.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ddas-db-config
  namespace: ddas
data:
  ddas.cnf: |
    [mysqld]
    innodb_buffer_pool_size=256M
    # performance_schema off saves ~200 MB; small max_connections keeps it light
    performance_schema=OFF
    max_connections=50
    table_open_cache=256
