# Headless Service: gives each member a stable DNS name (ddas-db-0.ddas-db, ...).
# publishNotReadyAddresses lets members find each other while they are still starting.
apiVersion: v1
kind: Service
metadata:
  name: ddas-db
  namespace: ddas
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: ddas-db
  ports:
    - name: mysql
      port: 3306
    - name: gr
      port: 33061
