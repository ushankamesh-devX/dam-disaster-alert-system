# One MySQL 8.4 server. On first start the image creates the app database and user.
# Restarts on its own after an EC2 stop/start (no cluster to reboot).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ddas-db
  namespace: ddas
spec:
  serviceName: ddas-db
  replicas: 1
  selector:
    matchLabels:
      app: ddas-db
  template:
    metadata:
      labels:
        app: ddas-db
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: ddas-secrets, key: MYSQL_ROOT_PASSWORD }
            - { name: MYSQL_DATABASE, value: dam_disaster_db }
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: ddas-secrets, key: DB_APP_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: ddas-secrets, key: DB_APP_PASSWORD }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: mysql, mountPath: /var/lib/mysql }
            - { name: config, mountPath: /etc/mysql/conf.d }
      volumes:
        - name: config
          configMap: { name: ddas-db-config }
  # Named "mysql" (not "data") so the old cluster volumes are left untouched as a backup
  volumeClaimTemplates:
    - metadata:
        name: mysql
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
