# 3 MySQL 8.4 servers. db-setup-job.yaml turns them into one InnoDB Cluster
# (1 primary + 2 replicas, automatic failover).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ddas-db
  namespace: ddas
spec:
  serviceName: ddas-db
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: ddas-db
  template:
    metadata:
      labels:
        app: ddas-db
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        # Each member needs its own server_id and the hostname others use to reach it
        - name: member-config
          image: mysql:8.4
          command: ["bash", "-c"]
          args:
            - |
              ord=${HOSTNAME##*-}
              cp /base/ddas.cnf /conf/ddas.cnf
              printf '[mysqld]\nserver_id=%d\nreport_host=%s.ddas-db\n' $((100 + ord)) "$HOSTNAME" > /conf/member.cnf
          volumeMounts:
            - { name: base-config, mountPath: /base }
            - { name: conf, mountPath: /conf }
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: ddas-secrets, key: MYSQL_ROOT_PASSWORD }
          ports:
            - { name: mysql, containerPort: 3306 }
            - { name: gr, containerPort: 33061 }
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: conf, mountPath: /etc/mysql/conf.d }
      volumes:
        - name: base-config
          configMap: { name: ddas-db-config }
        - name: conf
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
