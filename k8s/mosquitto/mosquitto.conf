# DDAS MQTT broker for Kubernetes.
# Unlike api/mosquitto/config/mosquitto.conf (local dev), anonymous access is off.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true

max_connections 100
