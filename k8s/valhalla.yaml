# Valhalla routing engine for evacuation routes. Internal only: valhalla:8002, called by the API.
# First start downloads the Sri Lanka OpenStreetMap extract and builds routing tiles
# (~10-20 min); later restarts reuse the tiles on the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valhalla-tiles
  namespace: ddas
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: ddas
spec:
  replicas: 1
  strategy:
    type: Recreate   # the tiles volume is ReadWriteOnce
  selector:
    matchLabels:
      app: valhalla
  template:
    metadata:
      labels:
        app: valhalla
    spec:
      containers:
        - name: valhalla
          image: ghcr.io/valhalla/valhalla-scripted:latest
          imagePullPolicy: IfNotPresent   # keep the same build across restarts
          env:
            - { name: tile_urls, value: "https://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf" }
            - { name: serve_tiles, value: "True" }
            - { name: build_admins, value: "True" }
            - { name: build_time_zones, value: "False" }
            - { name: build_elevation, value: "False" }
            - { name: force_rebuild, value: "False" }
            - { name: server_threads, value: "2" }
          ports:
            - containerPort: 8002
          startupProbe:
            httpGet: { path: /status, port: 8002 }
            periodSeconds: 30
            failureThreshold: 80   # up to 40 min for the first tile build
          readinessProbe:
            httpGet: { path: /status, port: 8002 }
            periodSeconds: 30
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 2Gi }   # tile build peaks here; serving uses far less
          volumeMounts:
            - { name: tiles, mountPath: /custom_files }
      volumes:
        - name: tiles
          persistentVolumeClaim: { claimName: valhalla-tiles }
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: ddas
spec:
  selector:
    app: valhalla
  ports:
    - port: 8002
